name: Firestore Rules Tests

on: 
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/rules-tests/**'
      - 'firebase.json'
      - '.github/workflows/verify_firestore_rules_test.yml'

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json
      
      - name: Install test dependencies
        run: npm install --prefix firebase/rules-tests
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Security Rules tests
        run: >
          firebase emulators:exec --project demo-notes 
          --only firestore "npm --prefix firebase/rules-tests test"